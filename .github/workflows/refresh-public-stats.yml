name: Refresh public stats

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run stats:grant
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Publish changed snapshot
        run: |
          if git diff --quiet -- app/stats/grant-stats.json; then
            echo "No statistics changed"
            exit 0
          fi
          git config user.name "sea-battle-stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add app/stats/grant-stats.json
          git commit -m "chore(stats): refresh public snapshot"
          git push
